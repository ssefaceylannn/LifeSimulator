# Google Play derlemesi: imzalı .aab (Play Console'a yüklenir) ve denemek için imzalı .apk üretir.
# YALNIZCA ELLE başlatılır: GitHub › Actions › "Android Google Play" › Run workflow.
#
# Gereken gizli değişkenler (GitHub › Settings › Secrets and variables › Actions):
#   ANDROID_KEYSTORE_B64   Yükleme anahtar deposu (.jks) dosyasının base64 hâli
#   ANDROID_KEYSTORE_PASS  Anahtar deposu parolası
#   ANDROID_KEY_ALIAS      Anahtar adı (ör. upload)
#   ANDROID_KEY_PASS       Anahtar parolası
#   PGS_PROJECT_ID         (isteğe bağlı) Play Games Services proje kimliği (sayı). Yoksa hesap bağlama kapalı kalır.
#   ADMOB_ANDROID_APP_ID, ADMOB_ANDROID_INTERSTITIAL, ADMOB_ANDROID_REWARDED (AdMob; yoksa test reklamları çıkar)
#   PLAY_SERVICE_ACCOUNT_JSON (isteğe bağlı) Play Console API hizmet hesabı; varsa "Dahili test" kanalına otomatik yükler.
# Ayrıntılı adımlar: MAGAZA-REHBERI.md
name: Android Google Play
on:
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_ID: com.hayatsimulatoru.oyun
      HAS_PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Oyunu derle
        env:
          ADMOB_ANDROID_INTERSTITIAL: ${{ secrets.ADMOB_ANDROID_INTERSTITIAL }}
          ADMOB_ANDROID_REWARDED: ${{ secrets.ADMOB_ANDROID_REWARDED }}
        run: node scripts/build-single.js && node scripts/build-app.js
      - name: Capacitor ve oyun hizmetleri eklentisi
        run: npm install --no-save --no-audit --no-fund @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8 @idleflowgames/capacitor-play-games@0.3 @capacitor-community/admob@8 @capgo/native-purchases@8
      - name: Android projesi oluştur
        env:
          PGS: ${{ secrets.PGS_PROJECT_ID }}
          ADMOB_APP: ${{ secrets.ADMOB_ANDROID_APP_ID }}
        run: |
          npx cap add android
          npx cap sync android
          VERSION=$(node -p "require('./package.json').version")
          G=android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" $G
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" $G
          # Uygulama simgesi (1024 px kaynaktan)
          pip install --quiet pillow
          python3 store/android/icons.py
          # AdMob uygulama kimliği (yoksa Google'ın test kimliği)
          AID=${ADMOB_APP:-ca-app-pub-3940256099942544~3347511713}
          sed -i "s#</application>#    <meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"$AID\" />\n    </application>#" android/app/src/main/AndroidManifest.xml
          # Dikey ekran
          sed -i 's/<activity/<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml
          # Play Games Services (varsa)
          if [ -n "$PGS" ]; then
            printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n  <string name="game_services_project_id" translatable="false">%s</string>\n</resources>\n' "$PGS" > android/app/src/main/res/values/games-ids.xml
            sed -i 's#<application#<application#; s#</application>#    <meta-data android:name="com.google.android.gms.games.APP_ID" android:value="@string/game_services_project_id" />\n    </application>#' android/app/src/main/AndroidManifest.xml
          fi
      - name: AAB ve APK (anahtar varsa imzalı, yoksa deneme imzalı)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          mkdir -p out
          cd android
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > $RUNNER_TEMP/upload.jks
            SIGN="-Pandroid.injected.signing.store.file=$RUNNER_TEMP/upload.jks -Pandroid.injected.signing.store.password=$KS_PASS -Pandroid.injected.signing.key.alias=$KEY_ALIAS -Pandroid.injected.signing.key.password=$KEY_PASS"
            ./gradlew --no-daemon bundleRelease assembleRelease $SIGN
            cp app/build/outputs/bundle/release/app-release.aab ../out/HayatSimulatoru.aab
            cp app/build/outputs/apk/release/app-release.apk ../out/HayatSimulatoru.apk
          else
            # Yükleme anahtarı yok: telefona kurup denemek için hata ayıklama imzalı APK
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../out/HayatSimulatoru-deneme.apk
            echo "Not: Play Console'a yüklenecek imzalı .aab için ANDROID_KEYSTORE_* gizli değişkenlerini ekle." > ../out/OKU-BENI.txt
          fi
          ls -la ../out
      - uses: actions/upload-artifact@v4
        with:
          name: HayatSimulatoru-android
          path: out/
          retention-days: 30
      - name: Play Console › Dahili test (hizmet hesabı varsa)
        if: ${{ env.HAS_PLAY_JSON == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.hayatsimulatoru.oyun
          releaseFiles: out/HayatSimulatoru.aab
          track: internal
          status: draft
